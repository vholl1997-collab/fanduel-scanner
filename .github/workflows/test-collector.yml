name: Test collector

on:
  push:
    branches: [main]
    paths:
      - "collector.py"
      - "realtime_service.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/test-collector.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.31,<3"
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile collector.py realtime_service.py
