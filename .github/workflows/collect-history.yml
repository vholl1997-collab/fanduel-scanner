name: Collect Polymarket sports history

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polymarket-history-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out collector code
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check out persistent history branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-store
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests
      - name: Collect current probabilities
        run: python collector.py data-store/history.json
      - name: Save updated history
        working-directory: data-store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "No history changes to save."
          else
            git commit -m "Update Polymarket sports probability history"
            git push origin data
          fi
