name: Collect Polymarket sports history

on:
  schedule:
    # Offset from minute zero to reduce GitHub Actions scheduling congestion.
    # Best effort only: GitHub may delay or skip scheduled jobs.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polymarket-history-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out collector code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check out persistent history branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-store
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install "requests>=2.31,<3"
      - name: Run collector unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect current probabilities
        run: python collector.py data-store/history.json
      - name: Save updated history
        working-directory: data-store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json dashboard.json
          if git diff --cached --quiet; then
            echo "No history changes to save."
          else
            git commit -m "Update Polymarket sports probability history"
            git push origin HEAD:data
          fi
